<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    svg { color: #1a2230; }
    @media (prefers-color-scheme: dark) { svg { color: #e8eaed; } }
  </style>
  <!-- 连接键：圆头粗线，接住两端的原子 -->
  <g stroke="currentColor" stroke-width="3.6" stroke-linecap="round" fill="none">
    <line x1="33.7" y1="33.4" x2="36.3" y2="9.1"/>
    <line x1="33.7" y1="33.4" x2="8.9" y2="34.3"/>
    <line x1="33.7" y1="33.4" x2="55.4" y2="33.4"/>
    <line x1="33.7" y1="33.4" x2="43.4" y2="49.4"/>
  </g>
  <!-- 五个原子：中心大，四周小 -->
  <g fill="currentColor">
    <circle cx="36.3" cy="9.1" r="5.05"/>
    <circle cx="8.9" cy="34.3" r="4.87"/>
    <circle cx="55.4" cy="33.4" r="4.6"/>
    <circle cx="43.4" cy="49.4" r="5.76"/>
    <circle cx="33.7" cy="33.4" r="8.4"/>
  </g>
</svg>
